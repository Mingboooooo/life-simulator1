<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>千禧 2000 人生模擬器 · 世紀命運</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="gameboy-chassis">
    <!-- 機身頂部：電源燈、音訊切換、復古標籤 -->
    <div class="chassis-header">
      <div class="battery-status">
        <div class="battery-led"></div>
        <span class="battery-text">BATTERY [OK]</span>
      </div>

      <!-- BGM 開關按鈕 -->
      <button id="bgm-toggle" style="background: none; border: 1.5px solid #4a483e; border-radius: 12px; padding: 2px 8px; font-size: 10px; font-weight: bold; color: #4a483e; cursor: pointer; display: flex; align-items: center; gap: 4px;">
        <span id="bgm-icon">🔇</span>
        <span id="bgm-text">BGM OFF</span>
      </button>

      <div class="mode-badge">COLOR SYSTEM</div>
    </div>

    <!-- 液晶螢幕視窗 -->
    <div class="screen-container">
      <div>
        <header class="game-header">
          <h1 class="game-title">▶ 2000 LIFE SIMULATOR ◀</h1>
          <p id="sub-header" class="sub-header">PRESS START TO PLAY</p>
        </header>

        <!-- 5 大數值面板 -->
        <div id="stats-panel" class="stats-panel hidden"></div>
      </div>

      <!-- 動態遊戲內容畫布 -->
      <main id="game-canvas" class="main-canvas"></main>

      <!-- 底部指令提示 -->
      <footer class="game-footer">
        <span>[A] 確定 / 選擇</span>
        <span>SELECT ▼</span>
      </footer>
    </div>
  </div>

  <script src="./script.js"></script>
</body>
</html>
